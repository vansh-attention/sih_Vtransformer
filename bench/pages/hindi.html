<!DOCTYPE html>
<!-- Fixture 10 — Devanagari. An India-facing product that has never been tested on an
     Indian-language page. Government portals routinely render labels in Hindi while the
     values stay in Latin digits, and some fields carry Devanagari names. -->
<html lang="hi"><head><meta charset="utf-8"><title>पेंशन आवेदन</title></head>
<body>
  <h1>पेंशन आवेदन प्रपत्र</h1>
  <table>
    <tr><td>आवेदक का नाम</td><td><input id="nm" name="applicant_name" value="राजेश कुमार शर्मा"></td></tr>
    <tr><td>आधार संख्या</td><td><input id="aad" name="aadhaar" value="234567890124"></td></tr>
    <tr><td>पैन कार्ड</td><td><input id="pan" name="pan" value="ABCPE1234F"></td></tr>
    <tr><td>मोबाइल नंबर</td><td><input id="mob" name="mobile" value="9845012345"></td></tr>
    <tr><td>आवेदन क्रमांक</td><td><input id="appno" name="application_no" value="789012345678"></td></tr>
    <tr><td>कुल राशि</td><td><input id="amt" name="amount" value="999999999999"></td></tr>
  </table>
  <label for="pw">पासवर्ड</label>
  <input id="pw" type="password" value="guptशब्द1">
  <p id="note">संपर्क करें: rajesh.sharma@example.in अथवा 1800 200 3333 पर।</p>
  <button id="sub">आवेदन जमा करें</button>
</body></html>

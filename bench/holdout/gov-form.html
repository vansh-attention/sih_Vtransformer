<!DOCTYPE html>
<!-- HOLDOUT 02. Table-based layout with label text in the adjacent cell and no
     <label> elements at all - the single most common Indian government form idiom. -->
<html lang="en"><head><meta charset="utf-8"><title>Scholarship application</title></head>
<body>
  <h2>National Scholarship Portal — Application</h2>
  <table>
    <tr><td>Applicant Name</td><td><input id="nm" name="applicant_name" value="Rohit Deshmukh"></td></tr>
    <tr><td>Aadhaar Number</td><td><input id="aad" name="aadhaar" value="234567890124"></td></tr>
    <tr><td>Application Number</td><td><input id="app" name="application_no" value="789012345678"></td></tr>
    <tr><td>Bank IFSC</td><td><input id="ifsc" name="ifsc" value="SBIN0001234"></td></tr>
    <tr><td>Annual Family Income</td><td><input id="inc" name="income" value="450000"></td></tr>
    <tr><td>Registered Email</td><td><input id="em" name="email" value="rohit.d@stud.ac.in"></td></tr>
    <tr><td>Login Password</td><td><input id="pw" type="password" value="Sch0lar!"></td></tr>
  </table>
  <img id="photo" src="applicant.jpg" alt="">
  <button id="sub">Submit application</button>
  <div id="offscr" style="visibility:hidden"><input id="ghost" value="ABCPE1234F"></div>
</body></html>

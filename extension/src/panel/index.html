<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Privacy Agent</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;min-width:0}
  /* The side panel is narrow and the user can drag it narrower still. Long tokens, URLs
     and refusal messages must wrap rather than push a card past the edge. Defensive:
     no overflow was observed at the default width, but the width is not ours to choose. */
  body,.turn,.row,.note,.phase{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
  body{margin:0;padding:16px;background:#0d1117;color:#e6edf3;
       font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .hdr{display:flex;gap:10px;align-items:center;margin-bottom:16px}
  .badge{width:34px;height:34px;border-radius:9px;background:#161b22;
         border:1px solid #30363d;display:flex;align-items:center;justify-content:center}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  .sub{color:#7d8590;font-size:11px}
  input,button{font:inherit}
  .target{font-size:11px;color:#7d8590;padding:0 2px 6px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .target b{color:#e6edf3;font-weight:600}
  .btns{display:flex;gap:8px}
  #stop{flex:0 0 auto;padding:10px 14px;background:#21262d;border:1px solid #30363d;
        border-radius:8px;color:#f85149;cursor:pointer;font-weight:600;font-size:13px}
  #stop:hover{background:#2d2126;border-color:#f85149}
  /* A static line during a 3-second wait reads as a freeze. */
  .working::after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;
                  border-radius:50%;background:#58a6ff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .withheld-note{margin:0;padding:8px 12px;background:#241a10;
                 border-top:1px solid #30363d;font-size:11px;color:#f0883e}
  #goal{width:100%;padding:10px 12px;background:#161b22;border:1px solid #30363d;
        border-radius:8px;color:#e6edf3;margin-bottom:8px;font-size:13px}
  #goal:focus{outline:none;border-color:#2b3a8f;box-shadow:0 0 0 3px #2b3a8f33}
  #run{flex:1;padding:10px;background:#238636;border:0;border-radius:8px;
       color:#fff;cursor:pointer;font-weight:600;font-size:13px;
       transition:background .12s}
  #run:hover:not(:disabled){background:#2ea043}
  #run:disabled{background:#21262d;color:#7d8590;cursor:default}
  .phase{margin:12px 0;padding:9px 12px;background:#161b22;border:1px solid #30363d;
         border-radius:8px;font-size:11px;color:#7d8590}
  .turn{border:1px solid #30363d;border-radius:8px;margin-bottom:10px;overflow:hidden}
  .turn h2{font-size:11px;margin:0;padding:8px 12px;background:#161b22;
           border-bottom:1px solid #30363d;font-weight:600;line-height:1.4}
  .row{padding:7px 12px;border-bottom:1px solid #1c2128;font-size:11px}
  .row:last-child{border-bottom:0}
  .chip{display:inline-block;background:#21262d;border:1px solid #30363d;
        border-radius:999px;padding:2px 9px;font-size:10px;margin:2px 3px 2px 0;
        font-weight:500}
  .chip b{color:#f0883e}
  .allow{color:#3fb950}.deny{color:#f85149}
  .mask{color:#f85149;letter-spacing:1px;font-family:ui-monospace,Menlo,monospace}
  .tok{color:#3fb950;font-family:ui-monospace,Menlo,monospace}
  .t{color:#7d8590;font-size:10px}
  .t b{color:#e6edf3}
  #settings{margin-top:10px;border:1px solid #30363d;border-radius:6px;
            background:#161b22}
  #settings summary{color:#7d8590}
  #settings label{display:block;padding:0 10px;font-size:10px;color:#7d8590}
  #settings input{width:calc(100% - 20px);margin:4px 10px 6px;padding:6px;
                  background:#0d1117;border:1px solid #30363d;border-radius:4px;
                  color:#e6edf3;font-size:11px}
  #serverstatus{padding:0 10px 8px}
  .note{margin-top:12px;padding:8px 10px;border-left:3px solid #f0883e;
        background:#161b22;font-size:10px;color:#8b949e}
  pre{margin:6px 0 0;padding:8px;background:#010409;border-radius:4px;
      font-size:10px;color:#8b949e;max-height:200px;overflow:auto;white-space:pre-wrap}
  summary{cursor:pointer;color:#58a6ff;font-size:11px;padding:6px 10px}
</style></head>
<body>
  <header class="hdr">
    <div class="badge">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 2 L21 5 v6 c0 5-4 8.5-9 11 -5-2.5-9-6-9-11 V5 Z" fill="#2b3a8f"/>
        <ellipse cx="12" cy="10.5" rx="5.2" ry="3" fill="#fff"/>
        <circle cx="12" cy="10.5" r="1.9" fill="#d9970f"/>
        <rect x="6.4" y="9.9" width="11.2" height="1.2" fill="#1a235c"/>
      </svg>
    </div>
    <div>
      <h1>Privacy Agent</h1>
      <div class="sub">Nothing personal leaves this machine</div>
    </div>
  </header>
  <div class="target" id="target">checking this tab…</div>
  <input id="goal" placeholder="e.g. Fill in the form and submit it">
  <div class="btns">
    <button id="run">Run on this tab</button>
    <button id="stop" hidden>Stop</button>
  </div>
  <details id="settings">
    <summary>Settings</summary>
    <label for="server">Reasoning server</label>
    <input id="server" placeholder="http://127.0.0.1:8975">
    <div class="t" id="serverstatus">not checked</div>
  </details>
  <div class="phase" id="phase">idle</div>
  <div id="ledger"></div>
  <div class="note"><b>Everything above is checkable.</b> The chips count values
    destroyed <i>before</i> any network request. Open the raw bytes to confirm for
    yourself that no real value left this machine.</div>
  <script type="module" src="../../dist/panel.js"></script>
</body></html>
